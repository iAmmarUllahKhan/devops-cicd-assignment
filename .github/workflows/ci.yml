
name: Sales dashboard CI/CD pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run automated unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v6
        with:
          name: sales-dashboard-build
          path: dist/
          if-no-files-found: error

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::708379561853:role/GitHubActions-SalesDashboard-Role
          aws-region: ap-south-1

      - name: Package application
        run: |
          cd dist
          zip -r ../sales-dashboard-${GITHUB_SHA}.zip .

      - name: Upload artifact to AWS S3
        run: |
          aws s3 cp \
            sales-dashboard-${GITHUB_SHA}.zip \
            s3://ammar-devops-cicd-artifacts-2026/builds/sales-dashboard-${GITHUB_SHA}.zip

      - name: Retrieve latest successful build from S3
        run: |
          aws s3 cp \
            s3://ammar-devops-cicd-artifacts-2026/builds/sales-dashboard-${GITHUB_SHA}.zip \
            deployment.zip

      - name: Extract deployment files
        run: |
          mkdir -p deployment
          unzip -o deployment.zip -d deployment

      - name: Deploy website to S3 Sydney
        run: |
          aws s3 sync deployment/ \
            s3://ammar-devops-dashboard-live-2026/ \
            --delete \
            --region ap-southeast-2

      - name: Refresh CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EFQLTLOWRAF5H \
            --paths "/*"
